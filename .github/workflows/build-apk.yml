name: Build Arena APK

on:
  push:
    branches: [ "main", "arena/**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.5
          cache-read-only: false

      - name: Setup Android SDK (Manual - robust)
        run: |
          echo "=== Android SDK Setup ==="
          echo "ANDROID_HOME=${ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}"
          
          SDKMANAGER=""
          if [ -f "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          elif [ -f "/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
            export ANDROID_HOME="/usr/local/lib/android/sdk"
            export ANDROID_SDK_ROOT="/usr/local/lib/android/sdk"
          else
            SDKMANAGER=$(find /usr/local -name sdkmanager -type f 2>/dev/null | head -1)
          fi
          
          echo "Using SDKMANAGER: $SDKMANAGER"
          ls -lh "${ANDROID_HOME}/platforms/" || true
          ls -lh "${ANDROID_HOME}/build-tools/" || true
          
          yes | $SDKMANAGER --licenses || echo "Licenses acceptance done"
          $SDKMANAGER --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" || echo "Install attempted"
          $SDKMANAGER --list_installed || true
          
          echo "ANDROID_HOME=${ANDROID_HOME}" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}" >> $GITHUB_ENV

      - name: Generate Gradle Wrapper if missing
        run: |
          echo "=== Checking Gradle Wrapper ==="
          ls -la gradle/wrapper/ || echo "no wrapper dir"
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Wrapper jar missing - generating"
            gradle wrapper --gradle-version 8.5 --distribution-type bin
          fi
          chmod +x gradlew
          ls -lh gradle/wrapper/
          ./gradlew --version || gradle --version

      - name: Build Debug APK - Arena
        id: build_debug
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build-debug.log
          echo "=== Debug APK built ==="
          ls -lh app/build/outputs/apk/debug/

      - name: Build Release APK - Arena (unsigned)
        if: success()
        run: |
          set -o pipefail
          ./gradlew assembleRelease --stacktrace 2>&1 | tee build-release.log
          echo "=== Release APK built ==="
          ls -lh app/build/outputs/apk/release/

      - name: List APKs
        if: always()
        run: |
          echo "=== Debug ==="
          ls -lh app/build/outputs/apk/debug/ || true
          echo "=== Release ==="
          ls -lh app/build/outputs/apk/release/ || true
          mkdir -p build/outputs
          find app/build/outputs -name "*.apk" -type f -exec cp {} build/outputs/ \; || true
          ls -lh build/outputs/ || true

      - name: Upload Build Logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build-*.log
            app/build/reports/
            app/build/outputs/logs/
          retention-days: 7
          if-no-files-found: warn

      - name: Upload Debug APK Artifact
        if: success() || steps.build_debug.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Arena-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Release APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Arena-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: warn

      - name: Create Release (on main push)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Arena v1.0.${{ github.run_number }} - Ultra Smooth"
          body: |
            Arena AI Android App - Ultra Smooth WebView Build
            
            **Optimizations:**
            - Hardware acceleration, standalone WebView, HIGH priority, cache, no overscroll
            - GPU layer 3D transforms, content-visibility auto, no heavy CSS during scroll
            - Passive listeners, virtual list, lazy images async
            - Notification & 3-button nav color matched #0A0A0B
            - Cache + layout preload + API content + smooth animations

            Package: ai.arena.app
            APK: Arena
            Commit: ${{ github.sha }}
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
