name: Build Arena APK

on:
  push:
    branches: [ "main", "arena/**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Generate Gradle Wrapper if missing
        run: |
          ls -la gradle/wrapper/ || echo "no wrapper dir"
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Wrapper jar missing - generating with gradle wrapper"
            gradle wrapper --gradle-version 8.5 --distribution-type bin
          fi
          chmod +x gradlew
          ls -lh gradle/wrapper/

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Debug APK - Arena
        run: ./gradlew assembleDebug --stacktrace --info

      - name: Build Release APK - Arena (unsigned)
        run: ./gradlew assembleRelease --stacktrace

      - name: List & Rename APKs to Arena
        run: |
          echo "=== Debug ==="
          ls -lh app/build/outputs/apk/debug/ || true
          echo "=== Release ==="
          ls -lh app/build/outputs/apk/release/ || true
          mkdir -p build/outputs
          # Copy with Arena name
          find app/build/outputs -name "*.apk" -exec cp {} build/outputs/ \;
          cd build/outputs
          for f in *.apk; do
            if [[ "$f" == *"debug"* ]]; then
              mv "$f" "Arena-debug.apk" || true
            else
              mv "$f" "Arena-release-unsigned.apk" || true
            fi
          done
          # In case multiple files, keep both patterns
          cd ../..
          cp app/build/outputs/apk/debug/*.apk build/outputs/ 2>/dev/null || true
          cp app/build/outputs/apk/release/*.apk build/outputs/ 2>/dev/null || true
          ls -lh build/outputs/
          ls -lh app/build/outputs/apk/debug/
          ls -lh app/build/outputs/apk/release/

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Arena-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Arena-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: warn

      - name: Create Release (on main push)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Arena v1.0.${{ github.run_number }} - Ultra Smooth"
          body: |
            Arena AI Android App - Ultra Smooth WebView Build
            
            **Implemented Optimizations:**

            **1. Android Native:**
            - ✅ Hardware acceleration enabled (manifest + LAYER_TYPE_HARDWARE)
            - ✅ WebView standalone (never inside ScrollView) - FrameLayout root
            - ✅ Render priority HIGH, memory caching (50MB), overscroll disabled

            **2. CSS / Rendering (JS Injection):**
            - ✅ Force GPU layer rendering on scrollable elements using 3D transforms (translate3d, translateZ)
            - ✅ content-visibility: auto for off-screen list elements (contain-intrinsic-size 500px)
            - ✅ Remove heavy CSS (box-shadows, blur filters removed during scroll via .is-scrolling class)

            **3. JavaScript (JS Injection):**
            - ✅ All touch/scroll listeners passive ({ passive: true }) via EventTarget override
            - ✅ DOM nodes minimal (virtual list pattern via content-visibility + IntersectionObserver for videos/iframes)
            - ✅ Images async decoding + lazy loading (loading=lazy, decoding=async)

            **Extra:**
            - ✅ Notification panel & 3-button navigation color perfectly matched (#0A0A0B)
            - ✅ Cache enabled, layout pre-load then content via API
            - ✅ Beautiful smooth animations (fade, scale, slide - 60/120fps)
            - ✅ Edge-to-edge, shimmer preload, error handling, file chooser

            **Package:** ai.arena.app
            **APK Name:** Arena
            **Min SDK:** 24, Target SDK: 34
            **Built from:** ${{ github.sha }}
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
