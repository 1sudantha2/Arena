name: Build Arena APK

on:
  push:
    branches: [ "main", "arena/**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.5
          cache-read-only: false

      - name: Setup Android SDK (Manual - robust)
        run: |
          echo "=== Android SDK Setup ==="
          echo "ANDROID_HOME=${ANDROID_HOME}"
          SDKMANAGER=""
          if [ -f "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          elif [ -f "/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
            export ANDROID_HOME="/usr/local/lib/android/sdk"
            export ANDROID_SDK_ROOT="/usr/local/lib/android/sdk"
          else
            SDKMANAGER=$(find /usr/local -name sdkmanager -type f 2>/dev/null | head -1)
          fi
          echo "Using SDKMANAGER: $SDKMANAGER"
          yes | $SDKMANAGER --licenses || echo "Licenses done"
          $SDKMANAGER --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" || echo "Install attempted"
          $SDKMANAGER --list_installed || true
          echo "ANDROID_HOME=${ANDROID_HOME}" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}" >> $GITHUB_ENV

      - name: Generate Gradle Wrapper if missing
        run: |
          ls -la gradle/wrapper/ || echo "no wrapper dir"
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.5 --distribution-type bin
          fi
          chmod +x gradlew
          ls -lh gradle/wrapper/
          ./gradlew --version

      - name: Build Debug APK - Arena
        id: build_debug
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build-debug.log
          echo "=== Debug APK built ==="
          ls -lh app/build/outputs/apk/debug/

      - name: Build Release APK - Arena (unsigned)
        if: success()
        run: |
          set -o pipefail
          ./gradlew assembleRelease --stacktrace 2>&1 | tee build-release.log
          echo "=== Release APK built ==="
          ls -lh app/build/outputs/apk/release/

      - name: List APKs
        if: always()
        run: |
          ls -lh app/build/outputs/apk/debug/ || true
          ls -lh app/build/outputs/apk/release/ || true
          mkdir -p build/outputs
          find app/build/outputs -name "*.apk" -type f -exec cp {} build/outputs/ \; || true
          ls -lh build/outputs/ || true

      - name: Upload Build Logs (on failure) - Artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build-*.log
            app/build/reports/
          retention-days: 7
          if-no-files-found: warn

      - name: Commit Build Failure Log to Repo (for debugging)
        if: failure()
        run: |
          echo "=== Build failed, committing log to repo for debugging ==="
          git config user.email "ci@arena.ai"
          git config user.name "Arena CI"
          # Create failure log file
          echo "# Build Failure Log - Run ${{ github.run_id }}" > BUILD_FAILURE_LOG.md
          echo "" >> BUILD_FAILURE_LOG.md
          echo "## Branch: ${{ github.ref_name }}" >> BUILD_FAILURE_LOG.md
          echo "## Commit: ${{ github.sha }}" >> BUILD_FAILURE_LOG.md
          echo "" >> BUILD_FAILURE_LOG.md
          echo '```' >> BUILD_FAILURE_LOG.md
          cat build-debug.log | tail -n 500 >> BUILD_FAILURE_LOG.md || echo "No log found" >> BUILD_FAILURE_LOG.md
          echo '```' >> BUILD_FAILURE_LOG.md
          echo "" >> BUILD_FAILURE_LOG.md
          echo "## Full log tail (last 1000 lines)" >> BUILD_FAILURE_LOG.md
          echo '```' >> BUILD_FAILURE_LOG.md
          cat build-debug.log | tail -n 1000 >> BUILD_FAILURE_LOG.md || true
          echo '```' >> BUILD_FAILURE_LOG.md
          
          git add BUILD_FAILURE_LOG.md
          git commit -m "ci: build failure log for run ${{ github.run_id }}" || echo "No changes to commit"
          git push origin HEAD:${{ github.ref_name }} || echo "Push failed, trying force"
          # Try again with pull rebase
          git pull --rebase origin ${{ github.ref_name }} || true
          git push origin HEAD:${{ github.ref_name }} || true

      - name: Upload Debug APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Arena-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Release APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Arena-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: warn
