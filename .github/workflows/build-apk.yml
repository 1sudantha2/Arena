name: Build Arena APK

on:
  push:
    branches: [ "main", "arena/**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.5
          cache-read-only: false

      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          SDKMANAGER=""
          if [ -f "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          elif [ -f "/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
            export ANDROID_HOME="/usr/local/lib/android/sdk"
            export ANDROID_SDK_ROOT="/usr/local/lib/android/sdk"
          else
            SDKMANAGER=$(find /usr/local -name sdkmanager -type f 2>/dev/null | head -1)
          fi
          echo "SDKMANAGER: $SDKMANAGER"
          yes | $SDKMANAGER --licenses || true
          $SDKMANAGER --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true
          echo "ANDROID_HOME=${ANDROID_HOME}" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}" >> $GITHUB_ENV

      - name: Generate Gradle Wrapper if missing
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.5 --distribution-type bin
          fi
          chmod +x gradlew
          ./gradlew --version

      - name: Build Debug APK - Arena
        run: |
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build-debug.log
          ls -lh app/build/outputs/apk/debug/

      - name: Build Release APK
        if: success()
        run: |
          ./gradlew assembleRelease --stacktrace 2>&1 | tee build-release.log
          ls -lh app/build/outputs/apk/release/

      - name: Rename APKs to Arena
        if: success()
        run: |
          mkdir -p build/outputs
          cp app/build/outputs/apk/debug/*.apk build/outputs/Arena-debug.apk || true
          cp app/build/outputs/apk/release/*.apk build/outputs/Arena-release-unsigned.apk || true
          # Also create Arena.apk as main
          cp build/outputs/Arena-debug.apk build/outputs/Arena.apk || cp app/build/outputs/apk/debug/app-debug.apk build/outputs/Arena.apk
          ls -lh build/outputs/
          ls -lh app/build/outputs/apk/debug/
          ls -lh app/build/outputs/apk/release/

      - name: Upload Debug APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Arena-debug-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            build/outputs/Arena*.apk
          retention-days: 30

      - name: Upload Release APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Arena-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Create GitHub Release (for main and arena branches)
        if: success() && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/arena/'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: arena-v1.0.${{ github.run_number }}
          name: "Arena v1.0.${{ github.run_number }} - Ultra Smooth"
          body: |
            ## Arena AI - Android Native App (Ultra Smooth WebView)

            **Package:** ai.arena.app
            **APK Name:** Arena
            **Website:** https://arena.ai/

            ### 🚀 Optimizations Implemented

            **1. Android Native:**
            - ✅ Hardware acceleration (manifest + LAYER_TYPE_HARDWARE)
            - ✅ WebView standalone (never inside ScrollView) - FrameLayout
            - ✅ Render priority HIGH via reflection (for older APIs), memory caching, overscroll disabled

            **2. CSS / Rendering (JS Injection):**
            - ✅ GPU layer rendering with 3D transforms (translate3d, translateZ, will-change)
            - ✅ content-visibility: auto for off-screen lists
            - ✅ Remove heavy CSS (box-shadows, blur filters during scroll via .is-scrolling)

            **3. JavaScript (JS Injection):**
            - ✅ Passive touch/scroll listeners ({ passive: true })
            - ✅ Virtual list pattern (content-visibility + IntersectionObserver)
            - ✅ Images async decoding & lazy loading

            **Extra:**
            - ✅ Notification panel & 3-button nav color matched #0A0A0B edge-to-edge
            - ✅ Cache enabled, layout preload + API content
            - ✅ Beautiful smooth animations (fade, scale, slide - 60/120fps)
            - ✅ Vector logo, adaptive icon

            **Build:** ${{ github.sha }}
            **Download:** Arena.apk below
          files: |
            build/outputs/Arena*.apk
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
